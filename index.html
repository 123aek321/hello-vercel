<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Vercel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #000;
      color: #fff;
    }
    .card {
      text-align: center;
      padding: 56px 40px;
      border: 1px solid #333;
      border-radius: 16px;
      background: linear-gradient(180deg, #111 0%, #000 100%);
      max-width: 560px;
    }
    h1 {
      font-size: 40px;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #fff, #888);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    p { color: #888; line-height: 1.8; font-size: 15px; }
    .tag {
      display: inline-block;
      margin-top: 28px;
      padding: 6px 14px;
      border: 1px solid #333;
      border-radius: 999px;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello, Vercel 👋</h1>
    <p>这个页面由 GitHub 仓库自动部署到 Vercel。<br />修改代码并 push，站点会自动更新。</p>
    <span class="tag">Deployed with Vercel · Hobby</span>
  </main>
</body>
</html>
